# @package _global_
defaults:
  - override /model: mvtracker

experiment_path: ./logs/pointodyssey
restore_ckpt_path: ./checkpoints/mvtracker_200000_june2025.pth

datasets:
  pointodyssey_prepared_dir: PointOdyssey_MVTracker_v5
  train:
    name: pointodyssey-multiview-training
    traj_per_sample: 256
  eval:
    names:
      - pointodyssey-multiview-validation

trainer:
  num_steps: 2000
  eval_freq: 500
  viz_freq: 500
  save_ckpt_freq: 500
  lr: 0.00005
  gradient_accumulation_steps: 8

augmentations:
  rgb: false
  variable_trajpersample: true
  variable_depth_type: false
  variable_num_views: false

modes:
  validate_at_start: true

logging:
  log_wandb: true
  wandb_project: mvtracker-pointodyssey
  tags: [pointodyssey, upstream-weights, reduced-rgb, long-run]
