# @package _global_
defaults:
  - diegesis_syn4d_mvkubric_gt_ddp
  - _self_

datasets:
  train:
    recipe_path: ${oc.env:MVTRACKER_TRAINING_RECIPE}
    force_gt_depth: true
    physical_batching:
      max_scenes: 2
      rank_local: false
  eval:
    names: []

trainer:
  num_steps: 20
  lr_schedule_steps: 2000
  eval_freq: 10000
  viz_freq: 10000
  save_ckpt_freq: 20
  hardware_metrics_interval: 1

modes:
  validate_at_start: false

augmentations:
  variable_depth_type: true

logging:
  tags:
    - diegesis-syn4d-mvkubric-25-25-50
    - recipe
    - forced-gt-depth
    - ddp2-h100
    - continual-training
    - smoke20
