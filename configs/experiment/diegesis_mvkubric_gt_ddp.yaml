        view_count_probabilities: [0.20, 0.10, 0.10, 0.25, 0.10, 0.25]
        trajectory_caps_by_view: {5: 819, 6: 512}
  eval:
    names:
      - tapvid3d-multiview-validation
      - kubric-multiview-v3
    num_workers: 4
    sources:
      diegesis:
        root: ${oc.env:MVTRACKER_DATA_ROOT,/mnt/mvtracker-data}/datasets/diegesis-mvtracker
        include_scene_ids: [bedroom01, diningroom02]
        views: [0, 1, 2, 3]
      mvkubric:
        root: ${oc.env:MVTRACKER_DATA_ROOT,/mnt/mvtracker-data}/datasets
        include_scene_ids: ["101", "102"]
        views: [0, 1, 2, 3]

trainer:
  num_steps: 1000
  lr_schedule_steps: 1000
  eval_freq: 250
  viz_freq: 10000
  save_ckpt_freq: 250
  lr: 0.00002
  wdecay: 0.00001
  anneal_strategy: linear
  grad_clip: 1.0
  gradient_accumulation_steps: 4
  expensive_diagnostics_interval: 50
  hardware_metrics_interval: 10
  precision: bf16-mixed
  visibility_loss_weight: 0.1

modes:
  validate_at_start: true

reproducibility:
  seed: ${oc.env:MVTRACKER_TRAINING_SEED}
  deterministic: false

augmentations:
  probability: 0.8
  rgb: true
  depth: true
  variable_depth_type: false
  variable_num_views: true
  cropping: true
  cropping_size: [384, 512]
  variable_vggt_crop_size: false
  keep_principal_point_centered: false
  variable_trajpersample: true
  scene_transform: true
  camera_params_noise: true
  normalize_scene_following_vggt: false

logging:
  log_wandb: true
  wandb_entity: jeetucl-ucl
  wandb_project: mvtracker-continual-training
  wandb_group: gt-depth-replay-v1
  wandb_run_name: ${oc.env:MVTRACKER_WANDB_RUN_NAME}
  wandb_run_id: ${oc.env:MVTRACKER_WANDB_RUN_ID}
  tags:
    - diegesis-mvkubric-50-50
    - gt-depth
    - ddp2-h100
    - full-model
    - continual-training

evaluation:
  evaluator:
    rerun_viz_indices: null
    forward_pass_log_indices: null
    mp4_track_viz_indices: null
