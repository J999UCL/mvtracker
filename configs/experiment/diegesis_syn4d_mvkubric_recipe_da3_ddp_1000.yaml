# @package _global_
defaults:
  - diegesis_syn4d_mvkubric_gt_ddp
  - _self_

datasets:
  train:
    recipe_path: ${oc.env:MVTRACKER_TRAINING_RECIPE}
    force_gt_depth: false
    runtime_depth_root: ${oc.env:MVTRACKER_RUNTIME_DEPTH_ROOT}
    runtime_depth_metrics_path: ${oc.env:MVTRACKER_RUNTIME_DEPTH_METRICS}
    physical_batching:
      lookahead_steps: 8
      cpu_cache_gib_per_rank: 24
      max_scenes: 2
      rank_local: false

trainer:
  num_steps: 1000
  lr_schedule_steps: 1000
  eval_freq: 250
  viz_freq: 10000
  save_ckpt_freq: 250
  hardware_metrics_interval: 10

modes:
  validate_at_start: true

augmentations:
  variable_depth_type: true

logging:
  wandb_group: expanded-syn4d-da3-1000
  tags:
    - diegesis-syn4d-mvkubric-25-25-50
    - syn4d-expanded-train-v1
    - recipe
    - da3-giant-1.1
    - mixed-depth-70-20-10
    - ddp2-h200-plus-producer
    - continual-training
    - steps1000
